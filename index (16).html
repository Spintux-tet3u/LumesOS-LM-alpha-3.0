<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--f:"Google Sans Flex","Google Sans","Roboto Flex",Roboto,system-ui,sans-serif;--sp:cubic-bezier(.34,1.56,.64,1);--e:cubic-bezier(.2,0,0,1);--s:#fef7ff;--os:#1d1b20;--p:#6750a4;--op:#fff;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--s:#141218;--os:#e6e0e9;--p:#cfbcff;--op:#381e72;color-scheme:dark}}
:root[data-theme=dark]{--s:#141218;--os:#e6e0e9;--p:#cfbcff;--op:#381e72;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{position:relative;overflow:hidden;background:var(--s);color:var(--os);font:400 14px/1.3 var(--f);-webkit-tap-highlight-color:transparent;user-select:none}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* papel de parede */
#wp{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 80% at 10% 0,var(--c1),transparent 60%),radial-gradient(90% 70% at 100% 100%,var(--c3),transparent 60%),var(--s)}
.bl{position:absolute;width:62vmax;height:62vmax;left:-20vmax;top:-26vmax;background:var(--c2);opacity:.5;border-radius:42% 58% 63% 37%/45% 38% 62% 55%;animation:sp 50s linear infinite}
.bl+.bl{width:46vmax;height:46vmax;left:auto;top:auto;right:-14vmax;bottom:-14vmax;background:var(--c1);opacity:.45;animation-direction:reverse}
@keyframes sp{to{transform:rotate(1turn)}}
/* barra de status */
#bar{position:absolute;inset:0 0 auto;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;font-size:15px;font-weight:600}
#st{display:flex;gap:8px;align-items:center;border:0;background:var(--sh);padding:7px 14px;border-radius:99px;cursor:pointer;font-size:13px;font-weight:600;transition:border-radius .5s var(--sp)}
#st:hover{border-radius:12px}#st .i{width:18px;height:18px}
/* home */
#home{position:absolute;inset:56px 0 0;z-index:1;display:grid;grid-template-rows:1fr auto;gap:12px;padding:0 24px 20px;overflow:auto;scrollbar-width:none}
#top{display:grid;gap:20px;align-content:center;width:100%;max-width:1060px;margin:auto}
@media(min-width:820px){#top{grid-template-columns:1fr 1fr;align-items:center;gap:48px}}
#dt{font-size:clamp(22px,3vw,30px);font-weight:500}
.chip{display:inline-flex;gap:8px;align-items:center;margin-top:10px;padding:8px 16px 8px 12px;border-radius:99px;background:var(--c3);color:var(--oc3);font-weight:600}
#clk{display:flex;flex-direction:column;margin-top:14px;font-size:clamp(84px,17vw,210px);font-weight:800;line-height:.82;letter-spacing:-.04em;font-variation-settings:"wdth" 125,"ROND" 100;font-variant-numeric:tabular-nums}
#h{color:var(--p)}#m{color:var(--t)}
#grid,#dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:12px 4px;align-content:center}
@media(min-width:820px){#grid{grid-template-columns:repeat(4,1fr)}}
/* ícones */
.app{display:grid;justify-items:center;gap:7px;padding:6px 2px;border:0;background:none;cursor:pointer;min-width:0}
.app em{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:normal;font-size:12px;font-weight:500}
.ic{display:grid;place-items:center;width:60px;height:60px;border-radius:36%;background:var(--b,var(--c1));color:var(--g,var(--oc1));transition:border-radius .5s var(--sp),transform .5s var(--sp)}
.t0{--b:var(--c1);--g:var(--oc1)}.t1{--b:var(--c2);--g:var(--oc2)}.t2{--b:var(--c3);--g:var(--oc3)}
.app .i{width:28px;height:28px}
.app:hover .ic{border-radius:50%;transform:scale(1.1)}
.app:active .ic{border-radius:22%;transform:scale(.9)}
#bot{display:grid;justify-items:center;gap:14px}
#dock{display:flex;gap:10px;padding:8px 14px;border-radius:38px;background:color-mix(in oklab,var(--sh) 72%,transparent);backdrop-filter:blur(24px)}
#all .ic{background:var(--p);color:var(--op)}
#sb,.fld{display:flex;align-items:center;gap:12px;height:56px;padding:0 20px;border:0;border-radius:28px;background:var(--shh);color:var(--ov);font-size:16px}

 rfh.f=()=>{if(!r.isConnected||(pg!='wifi'&&pg!='bt'))return;const y=r.scrollTop;r.innerHTML=pages[pg]();r.scrollTop=y;const i=r.querySelector('[data-pw]');i&&i.focus()};
 w.off.push(()=>{rfh.f=null;clearInterval(bti)});
 const pages={
  home:()=>`<h1>Configurações</h1><label class="sb2">${SRC}<input data-f placeholder="Pesquisar configurações" aria-label="Pesquisar"></label><div class="sg" data-l>${row('wifi',1,'wifi','Wi-Fi',W.on?(W.cur||'Não conectado'):'Desativado')+row('bt',2,'bt','Bluetooth',BT.on?((BT.paired.find(d=>d.c)||{}).n||'Ativado'):'Desativado')+row('look',3,'look','Papel de parede e estilo','Cor, estilo, tema e Nothing Mode')+row('anim',1,'spd','Animações','Abrir e fechar apps, velocidade')+row('perf',2,'perf','Desempenho','Modo normal ou leve')+row('blur',3,'blur','Modo blur',window.BM&&BM.on?'Ativado':'Desativado')+row('disp',3,'disp','Tela e brilho','Brilho e modo desktop')+row('lks',1,'disp','Tela de bloqueio','Relógio: estilo, tamanho e espessura')+row('seg',2,'lock','Segurança',SEC.sum())+row('dyn',2,'disp','Dynamic Island','Posição, tamanho e altura')+(window.PWA&&PWA.can()?row('inst',3,'inf','Instalar como app',PWA.hint()):'')+row('nav',1,'nav','Navegação','Botões ou gestos')+row('sto',2,'sto','Armazenamento','Dados do sistema e apps')+row('inf',3,'inf','Sobre o telefone','LumesOS '+VER)+(LS.g('tos.egg',0)?row('game',1,'game','Minigame','Flappy Lumes · recorde '+LS.g('tos.egg.best',0)):'')}</div><button class="sbr" data-egg><i class="lg" style="width:44px;height:36px;flex:none"></i><span><b>LumesOS</b><small>Versão ${VER} · por Zeezz dev</small></span></button>`,
  look:()=>hd('Papel de parede e estilo')+'<div data-h="wpb"></div><div class="sec">Cor</div><div data-h="sw"></div><div class="sec">Estilo</div><div data-h="vg"></div><div class="sec">Tema</div><div data-h="mg"></div><div class="sec">Nothing Mode</div><div data-h="snm"></div>',
  anim:()=>hd('Animações')+'<div data-h="sa"></div>'+`<div class="sg">${row('spd',2,'spd','Velocidade das animações','Toque para testar de 1x a 5x','')}</div>`,
  perf:()=>hd('Desempenho')+'<div data-h="sp"></div><small style="text-align:center;color:var(--ov)">O modo Leve reduz efeitos visuais para aparelhos mais fracos.</small>',
  blur:()=>hd('Modo blur')+'<div data-h="sbm"></div><small style="text-align:center;color:var(--ov)">Desfoque real em barras, painéis, janelas e botões. Usa mais GPU; o modo Leve desliga o blur.</small>',
  nav:()=>hd('Navegação')+'<div data-h="sn"></div><small style="text-align:center;color:var(--ov)">Botões: barra de navegação clássica. Gestos: deslize a partir das bordas.</small>',
  wifi:()=>{const tg=`<div class="sg"><div class="sr"><span class="si">${IC.wifi}</span><span><b>Wi-Fi</b><small>${W.on?(W.cur?'Conectado a '+W.cur:W.conn?'Conectando…':'Não conectado'):'Desativado'}</small></span><button class="tgl" data-wt aria-pressed="${!!W.on}" aria-label="Wi-Fi"></button></div></div>`;
   if(!W.on)return hd('Wi-Fi')+tg+'<small style="text-align:center;color:var(--ov)">Ative o Wi-Fi para ver as redes disponíveis.</small>';
   const L=NETS.map((n,i)=>[n,i]).sort((a,c)=>(c[0][0]==W.cur)-(a[0][0]==W.cur)||c[0][2]-a[0][2]),
   rows=L.map(([n,i])=>{const cur=n[0]==W.cur,cn=W.conn==n[0],sv=W.saved.includes(n[0]);
    let h=`<button class="sr c${1+i%3}" data-wn="${i}"><span class="si">${IC.wifi}</span><span><b>${n[0]}</b><small>${cn?'Conectando…':cur?'Conectado':sv?'Salva':'Protegida (WPA2)'}</small></span><em>${SG[n[2]]}</em>${IC.lock}</button>`;
    if(W.ask===i)h+=cur?`<div class="sr" style="display:grid;gap:10px"><div class="bg"><button data-wd>Desconectar</button><button data-wf>Esquecer</button><button data-wc>Fechar</button></div></div>`:`<div class="sr" style="display:grid;gap:10px"><label class="sb2">${IC.lock}<input data-pw type="password" placeholder="Senha de ${n[0]}" autocomplete="off" autocapitalize="off" spellcheck="false"></label><div class="bg"><button data-ws>Mostrar</button><button data-wc>Cancelar</button><button data-wk>Conectar</button></div></div>`;
    return h}).join('');
   return hd('Wi-Fi')+tg+'<div class="sec">Redes disponíveis</div><div class="sg">'+rows+'</div><div class="sg"><button class="sr c3" data-nt><span class="si">'+IC.inf+'</span><span><b>Esqueceu a senha?</b><small>As senhas estão na nota “Redes Wi-Fi”, no app Notas</small></span>'+CH+'</button></div>'},
  bt:()=>{const cb=BT.paired.find(d=>d.c),tg=`<div class="sg"><div class="sr"><span class="si">${IC.bt}</span><span><b>Bluetooth</b><small>${BT.on?(cb?'Conectado a '+cb.n:'Ativado'):'Desativado'}</small></span><button class="tgl" data-bt aria-pressed="${!!BT.on}" aria-label="Bluetooth"></button></div></div>`;

[data-theme=light] body.nm{--nbg:#f2f2f2;--nc:#fff;--nc2:#fff;--nln:#00000020;--nfg:#000;--nmu:#555;--nd:#00000024;--ng:color-mix(in oklab,var(--p) 28%,transparent);--npb:#000;--s:#f2f2f2;--os:#111;--sh:#fff;--shh:#e9e9e9;--sl:#f7f7f7;--ov:#666;--ol:#bbb;color-scheme:light}
body.nm .ic,body.nm .app:hover .ic,body.nm .app:active .ic{border-radius:50%!important}
body.nm .ic{background:var(--nc);color:var(--p);border:1px solid color-mix(in oklab,var(--p) 28%,var(--nln));transition:transform .35s var(--sp)}
body.nm .app:hover .ic{transform:scale(1.06)}
body.nm .app:active .ic{transform:scale(.84)}
body.nm .app em,body.nm .sec,body.nm #bar,body.nm #dt{font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
body.nm .app em{font-size:10.5px;font-weight:500;color:var(--nmu)}
body.nm .sec{font-size:11px;color:var(--ov);letter-spacing:.14em}
body.nm #all .ic{background:var(--p);color:var(--op);border-color:transparent}
body.nm #dock{background:color-mix(in oklab,var(--nbg) 85%,transparent);border:1px solid var(--nln);border-radius:99px;backdrop-filter:none}
body.nm #sb,body.nm .fld{background:var(--nc);border:1px solid var(--nln);border-radius:99px;font-family:var(--mono);font-size:13px}
body.nm #st{background:var(--nc);border:1px solid var(--nln)}
body.nm .sr,body.nm .chip{background:var(--nc2);border:1px solid var(--nln)}
body.nm .chip{color:var(--p)}
body.nm .sg{gap:6px}body.nm .sr{border-radius:26px}
body.nm .tgl[aria-pressed=true]{background:var(--p)}
body.nm .bg button[aria-pressed=true]{background:var(--p);color:var(--op)}
body.nm #dr,body.nm #qs,body.nm #sty{background:var(--sl)}
body.nm #clk{display:none}
.nmc{display:none}body.nm .nmc{display:block}
.nmc svg{display:block;fill:var(--nfg);width:min(74vw,380px);height:auto}
body.nm #nmclk{margin-top:14px}
.nmc .cl{fill:var(--p);animation:nmb 2s steps(1) infinite}@keyframes nmb{50%{opacity:.15}}
body.nm #lock{color:var(--nfg)}
body.nm #lh,body.nm #lm{display:none}
body.nm #lc{align-items:center}
body.nm #nmlc{order:1}body.nm #nmlc svg{width:min(80vw,430px)}
body.nm #ld{order:2;margin:16px 0 0;font:500 13px var(--mono);letter-spacing:.16em;color:var(--nmu)}
body.nm #lu{color:var(--nmu);font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase}
body.nm.gl .nmc svg{animation:nmg .75s steps(1,end) both}
@keyframes nmg{0%{opacity:0;clip-path:inset(0 0 85% 0);transform:translateX(-16px)}12%{opacity:1;clip-path:inset(40% 0 30% 0);transform:translateX(20px) skewX(-12deg)}24%{clip-path:inset(10% 0 60% 0);transform:translateX(-10px)}38%{clip-path:inset(70% 0 5% 0);transform:translateX(12px)}52%{clip-path:inset(0);transform:translateX(-6px) scaleY(1.07);filter:blur(1px)}70%{clip-path:inset(25% 0 25% 0);transform:translateX(4px)}100%{clip-path:inset(0);transform:none;filter:none}}
body.nm #win,body.nm #dr.on,body.nm #qs.on{animation:nmo .55s cubic-bezier(.16,1,.3,1)}
@keyframes nmo{from{filter:blur(22px) brightness(1.5)}to{filter:none}}
body.nm :is(#wp,#lock)[data-wp=preto]{background:var(--npb)}
.nmpx{display:none}
body.nm .nmpx{display:block;position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 0 2.3px,var(--nbg) 3px) 0 0/8px 8px;-webkit-backdrop-filter:brightness(1.8) saturate(1.7);backdrop-filter:brightness(1.8) saturate(1.7)}
body.nm #lock .nmpx{position:absolute;z-index:3}
body.nm #lock>header,body.nm #lock>#lc,body.nm #lock>#lu{z-index:4}
/* botão da gaveta em pixel */
body.nm #all .ic .i,body.nm #tbs .ic>*{display:none}
body.nm #tbs .ic{background:var(--p);color:var(--op);border-color:transparent}
body.nm #all .ic::before,body.nm #tbs .ic::before{content:"";width:30px;height:30px;background:radial-gradient(circle,var(--op) 0 2.5px,transparent 3px) 0 0/10px 10px;transition:transform .35s var(--sp)}
body.nm #all:hover .ic::before,body.nm #tbs:hover .ic::before{transform:rotate(90deg) scale(.9)}
/* modo videogame em pixel */
body.nm #pgm::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 0 2.3px,var(--nbg) 3px) 0 0/8px 8px;-webkit-backdrop-filter:brightness(1.8) saturate(1.7);backdrop-filter:brightness(1.8) saturate(1.7)}
body.nm #pgm>*{z-index:1}
body.nm #pgm .gtl{border-radius:50%;background:var(--nc);color:var(--p);border:2px solid color-mix(in oklab,var(--p) 35%,var(--nln))}
body.nm #pgm .gtl::after{display:none}
body.nm #pgm .gtl .i{filter:none}
body.nm #pgm .gtl.rn::before{background:var(--p);box-shadow:0 0 0 3px var(--nc)}
body.nm #pgm .grb{background:var(--nc);border:1px solid var(--nln);box-shadow:none}
body.nm #pgm .grb.pgf{background:var(--p);color:var(--op)}
body.nm #pgm .g-nm b,body.nm #pgm .g-hn,body.nm #pgm .g-us b{font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
body.nm #pgd .pgb,body.nm #pgf2{background:var(--nc);border:1px solid var(--nln);box-shadow:0 3px 0 var(--nln);-webkit-backdrop-filter:none;backdrop-filter:none}
body.nm #pgd .pgb.pdn,body.nm #pgf2:active{background:var(--p);color:var(--op)}
/* ===== Pixel OS no modo normal ===== */
#pxl,#sb .pxi{display:none}
body:not(.nm) #pxl{display:flex;justify-content:space-between;align-items:flex-end;position:absolute;left:24px;right:24px;bottom:calc(20px + env(safe-area-inset-bottom,0px));pointer-events:none;animation:pxu .6s var(--e) .1s both}
#pxl .pxb{pointer-events:auto}
body:not(.nm) #sb .pxi{display:grid;place-items:center;font-style:normal}
.pxb{width:54px;height:54px;border:0;border-radius:50%;display:grid;place-items:center;background:color-mix(in oklab,var(--os) 14%,transparent);color:var(--os);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);cursor:pointer;transition:transform .35s var(--sp),border-radius .45s var(--sp),background .2s}
.pxb[aria-pressed=true]{background:var(--p);color:var(--op)}
.pxb:active{transform:scale(.86);border-radius:34%}
.pxb .i{width:26px;height:26px}
.pxb.pxf{width:68px;height:68px;position:relative}.pxb.pxf .i{width:34px;height:34px}
.pxb.pxf::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--p);opacity:0;animation:pxp 2.6s ease-out infinite;pointer-events:none}
@keyframes pxp{from{transform:scale(.8);opacity:.7}to{transform:scale(1.25);opacity:0}}
@keyframes pxu{from{opacity:0;transform:translateY(26px)}}
@keyframes pxc{from{opacity:0;transform:scale(.9) translateY(14px);filter:blur(8px)}}
body:not(.nm) #lc{animation:pxc .65s var(--e) both}
body:not(.nm) #dock{background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
body:not(.nm) .kp .k{background:color-mix(in oklab,var(--p) 14%,var(--shh));color:var(--os);font-weight:500;transition:transform .3s var(--sp),border-radius .4s var(--sp)}
body:not(.nm) .kp .k:active{border-radius:34%;transform:scale(.92)}
body:not(.nm) .mu .ctl{display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:4px;width:100%;padding:0 4px}
body:not(.nm) .mu .ctl button{width:auto;height:64px;border:0;border-radius:8px;background:var(--c2);color:var(--oc2);transition:border-radius .4s var(--sp),transform .3s var(--sp)}
body:not(.nm) .mu .ctl>:first-child{border-radius:32px 8px 8px 32px}
body:not(.nm) .mu .ctl>:last-child{border-radius:8px 32px 32px 8px}
body:not(.nm) .mu .ctl .fab{background:var(--p);color:var(--op);border-radius:32px}
body:not(.nm) .mu .ctl button:active{border-radius:50%;transform:scale(.94)}
body:not(.nm) .mu .mt::before{content:"Este telefone";justify-self:start;width:max-content;margin-bottom:6px;padding:4px 12px;border-radius:99px;background:color-mix(in oklab,var(--os) 12%,transparent);font-size:12px;font-weight:600}
</style>
<style>
#sw{display:flex;flex-direction:column;gap:12px}
#sw .sws{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
#sw #swt{grid-template-columns:repeat(7,1fr)}
#sw .sw{max-width:40px}
#sw .cu{display:flex;flex-direction:column;gap:14px;margin-top:2px}
#cuh{-webkit-appearance:none;appearance:none;width:100%;height:14px;margin:6px 0;border-radius:7px;outline:0;cursor:pointer;background:linear-gradient(90deg,oklch(.7 .16 0),oklch(.7 .16 60),oklch(.7 .16 120),oklch(.7 .16 180),oklch(.7 .16 240),oklch(.7 .16 300),oklch(.7 .16 360))}
#cuh::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--p);border:4px solid var(--op,#fff);box-shadow:0 1px 6px #0007}
#cuh::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--p);border:4px solid var(--op,#fff);box-shadow:0 1px 6px #0007}
#sw .cr{display:flex;gap:8px}
#sw .cr>*{flex:1;height:44px;border:0;border-radius:22px;background:var(--shh);color:var(--os);font:inherit;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .3s var(--sp,ease)}
#sw .cr>*:active{transform:scale(.95)}
#sw .cr>*[hidden]{display:none}
#sw .cr input[type=color]{flex:none;width:26px;height:26px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer}
</style>
<script>
/* Cores: poucas cores base + tons + tom personalizado (matiz) */
;(()=>{
 const BS=[['Vermelho',25],['Laranja',55],['Amarelo',95],['Verde',145],['Turquesa',190],['Azul',250],['Roxo',295],['Rosa',350]],
  sw=(h,n)=>`<button class="sw" data-h="${h}" aria-label="${n}" style="background:oklch(.68 .17 ${h})"></button>`,
  dist=(a,b)=>{const d=Math.abs(a-b)%360;return Math.min(d,360-d)},
  near=()=>{let k=0;BS.forEach((b,i)=>{if(dist(b[1],hue)<dist(BS[k][1],hue))k=i});return k},
  hx2h=x=>{const[r,g,b]=[1,3,5].map(i=>parseInt(x.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4),
   l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b),m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b),s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b),
   A=1.9779984951*l-2.428592205*m+.4505937099*s,B=.0259040371*l+.7827717662*m-.808675766*s;
   return Math.round((Math.atan2(B,A)*180/Math.PI+360)%360*10)/10},
  cc=()=>{const v=LS.g('tos.cc',[]);return Array.isArray(v)?v.filter(isFinite):[]},
  add=h=>LS.s('tos.cc',cc().filter(x=>x!=h).concat(h).slice(-8));
 $('#sw').innerHTML=`<div class="sws" id="swb">${BS.map(b=>sw(b[1],b[0])).join('')}</div><div class="sec">Tons</div><div class="sws" id="swt"></div><div class="sec">Personalizado</div><div class="cu"><input id="cuh" type="range" min="0" max="360" step="1" aria-label="Ajustar matiz"><div class="cr"><label>Escolher cor<input id="cuc" type="color" value="#ff7a00"></label><button id="cus">Salvar tom</button></div></div><div class="sec" id="cut" hidden>Meus tons</div><div class="sws" id="swc"></div><div class="cr"><button id="cux" hidden>Limpar meus tons</button></div>`;
 const ui2=()=>{const k=near(),h0=BS[k][1],l=cc();
  $$('#swb .sw').forEach((b,i)=>b.setAttribute('aria-pressed',i==k));
  $('#swt').innerHTML=[-24,-16,-8,0,8,16,24].map(o=>{const h=(h0+o+360)%360;return sw(h,'Tom '+h)}).join('');
  $('#swc').innerHTML=l.map(h=>sw(h,'Tom salvo '+h)).join('');$('#cut').hidden=$('#cux').hidden=!l.length;
  $$('#swt .sw,#swc .sw').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.h==hue));
  const s=$('#cuh');if(s&&document.activeElement!==s)s.value=Math.round(hue)};
 const m0=mark;mark=function(){m0.apply(this,arguments);ui2()};
 $('#cuh').addEventListener('input',e=>{hue=+e.target.value;paint()});
 $('#cuc').addEventListener('input',e=>{hue=hx2h(e.target.value);paint()});
 $('#cuc').addEventListener('change',e=>{hue=hx2h(e.target.value);add(hue);paint()});
 $('#cus').addEventListener('click',()=>{add(hue);ui2();typeof toast=='function'&&toast('Tom salvo')});
 $('#cux').addEventListener('click',()=>{LS.s('tos.cc',[]);ui2()});
 try{const t=LS.g('tos.th',null);if(Array.isArray(t)&&t.length==3&&isFinite(t[0])&&t[1]>=0&&t[1]<=5){hue=+t[0];vi=+t[1];dark=!!t[2]}}catch(_){}
 paint();
})();
</script>
<style>
#wpbl,#lock>#lkb.lkb{position:absolute;inset:0;pointer-events:none;display:none}
#wpbl{z-index:5}#lock>#lkb.lkb{z-index:2}
#wpb .rgr{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:14px 18px;border-radius:22px;background:var(--shh);color:var(--os)}
#wpb .rgr b{font-weight:600;font-size:15px}#wpb .rgr em{font-style:normal;color:var(--ov);font-size:13px}
#wpb .rgr input{grid-column:1/-1;-webkit-appearance:none;appearance:none;width:100%;height:10px;margin:8px 0 2px;border-radius:5px;background:color-mix(in oklab,var(--p) 25%,var(--sh));outline:0;cursor:pointer}
#wpb .rgr input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--p);border:4px solid var(--op,#fff);box-shadow:0 1px 6px #0007}
#wpb .rgr input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--p);border:4px solid var(--op,#fff);box-shadow:0 1px 6px #0007}
</style>
<script>
/* Desfoque do papel de parede (tela inicial e tela de bloqueio) */
;(()=>{
 const mk=(host,id,cls)=>{let e=document.getElementById(id);if(!e){e=document.createElement('i');e.id=id;if(cls)e.className=cls;host.appendChild(e)}return e},
  H=$('#wp'),L=$('#lock'),K=[['tos.bl.h','Tela inicial'],['tos.bl.l','Tela de bloqueio']],
  num=k=>{const v=+LS.g(k,0);return isFinite(v)?Math.max(0,Math.min(40,v)):0},
  set=(e,v)=>{e.style.display=v?'block':'none';e.style.webkitBackdropFilter=e.style.backdropFilter=v?`blur(${v}px)`:'none'},
  apply=()=>{set(mk(H,'wpbl'),num(K[0][0]));set(mk(L,'lkb','lkb'),num(K[1][0]))};
 const box=$('#wpb');
 box.insertAdjacentHTML('beforeend','<div class="sec">Desfoque do papel de parede</div>'+K.map((k,i)=>`<label class="rgr"><b>${k[1]}</b><em id="bv${i}">${num(k[0])?num(k[0])+' px':'Sem desfoque'}</em><input type="range" min="0" max="40" step="1" value="${num(k[0])}" data-bl="${i}" aria-label="Desfoque da ${k[1].toLowerCase()}"></label>`).join(''));
 box.addEventListener('input',e=>{const r=e.target.closest('[data-bl]');if(!r)return;const i=+r.dataset.bl,v=+r.value;LS.s(K[i][0],v);$('#bv'+i).textContent=v?v+' px':'Sem desfoque';apply()});
 new MutationObserver(()=>{if(!document.getElementById('lkb'))apply()}).observe(L,{childList:true});
 apply();
})();
</script>
</body>
